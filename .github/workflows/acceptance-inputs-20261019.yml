name: Frozen contribution snapshot acceptance (temporary)

on:
  push:
    branches: [validation/acceptance-inputs-20261019]

permissions:
  contents: read

concurrency:
  group: frozen-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'LighthouseRobotics/Backplane'
    name: Frozen ${{ matrix.scope }} checks and proofs
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: native, minutes: 90}
          - {scope: combined, minutes: 45}
    env:
      CHECK_JOBS: '1'
      CHECK_SHARDS: '4'
      BEND_NO_TELEMETRY: '1'
      ACCEPTANCE_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve payload and apply exact source tree
        shell: bash
        run: |
          set -euo pipefail
          export ACCEPTANCE_EVIDENCE="$RUNNER_TEMP/acceptance-evidence/$ACCEPTANCE_SCOPE"
          echo "ACCEPTANCE_EVIDENCE=$ACCEPTANCE_EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/acceptance-inputs" "$ACCEPTANCE_EVIDENCE"
          cp -a acceptance-inputs/20261019/. "$RUNNER_TEMP/acceptance-inputs/"
          code=0
          python3 "$RUNNER_TEMP/acceptance-inputs/support/accept.py" apply \
            --scope "$ACCEPTANCE_SCOPE" --workspace "$GITHUB_WORKSPACE" --evidence "$ACCEPTANCE_EVIDENCE" \
            > "$ACCEPTANCE_EVIDENCE/apply.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$ACCEPTANCE_EVIDENCE/apply.exit"
          cat "$ACCEPTANCE_EVIDENCE/apply.log"
          exit "$code"
      - name: Bounded temporary proof swap
        shell: bash
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          size=$(( (available - 8 * 1073741824) / 1073741824 ))
          [ "$size" -le 16 ] || size=16
          if [ "$size" -ge 2 ]; then
            sudo fallocate -l "${size}G" "$RUNNER_TEMP/acceptance-swap"
            sudo chmod 600 "$RUNNER_TEMP/acceptance-swap"
            sudo mkswap "$RUNNER_TEMP/acceptance-swap"
            sudo swapon "$RUNNER_TEMP/acceptance-swap"
          else
            echo 'Insufficient disk for additional swap while reserving 8 GiB'
          fi
          free -h | tee "$ACCEPTANCE_EVIDENCE/memory-before.log"
          df -h "$RUNNER_TEMP" >> "$ACCEPTANCE_EVIDENCE/memory-before.log"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: ./.github/actions/setup-bend
        with:
          version: '2.0.36'
      - name: Record exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            bend version
            bun --version
            git --version
            python3 --version
            sha256sum "$(command -v bend)" "$(command -v bun)"
            python3 "$RUNNER_TEMP/acceptance-inputs/support/hash-tree.py" "$HOME/.bend/bend2"
          } | tee "$ACCEPTANCE_EVIDENCE/toolchain.log"
          echo "ACCEPTANCE_REAL_BEND=$(command -v bend)" >> "$GITHUB_ENV"
      - name: Check every file and prove every law
        timeout-minutes: 40
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/acceptance-bin"
          cp "$RUNNER_TEMP/acceptance-inputs/support/bend-capture.sh" "$RUNNER_TEMP/acceptance-bin/bend"
          chmod +x "$RUNNER_TEMP/acceptance-bin/bend"
          export PATH="$RUNNER_TEMP/acceptance-bin:$PATH"
          code=0
          scripts/check.sh all > "$ACCEPTANCE_EVIDENCE/check.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$ACCEPTANCE_EVIDENCE/check.exit"
          cat "$ACCEPTANCE_EVIDENCE/check.log"
          verdict=1
          if [ -f "$ACCEPTANCE_EVIDENCE/proof.exit" ] && [ -f "$ACCEPTANCE_EVIDENCE/proof.log" ]; then
            . scripts/bendok.sh
            bend_verdict "$(cat "$ACCEPTANCE_EVIDENCE/proof.exit")" "$(cat "$ACCEPTANCE_EVIDENCE/proof.log")" && verdict=0
          fi
          printf '%s\n' "$verdict" > "$ACCEPTANCE_EVIDENCE/proof.verdict"
          python3 "$RUNNER_TEMP/acceptance-inputs/support/accept.py" verify \
            --scope "$ACCEPTANCE_SCOPE" --workspace "$GITHUB_WORKSPACE" --evidence "$ACCEPTANCE_EVIDENCE" || exit 1
          [ "$code" = 0 ] && [ "$verdict" = 0 ]
      - name: Check browser owner reply and side effects
        shell: bash
        run: |
          set -euo pipefail
          code=0
          bend test/bots_test.bend > "$ACCEPTANCE_EVIDENCE/bots-test.log" 2>&1 || code=$?
          cat "$ACCEPTANCE_EVIDENCE/bots-test.log"
          test "$code" -eq 0
          grep -q '^ok ' "$ACCEPTANCE_EVIDENCE/bots-test.log"
          ! grep -q -E '^(FAIL|Error:)' "$ACCEPTANCE_EVIDENCE/bots-test.log"
      - name: Compile and run physical-root lifecycle regression
        if: matrix.scope == 'lifecycle' || matrix.scope == 'combined'
        env:
          BACKPLANE_SKIP_CHECK: '1'
          BACKPLANE_LOW_MEM: '1'
          BACKPLANE_JOBS: '2'
          BACKPLANE_GOOGLE_BAKE: '0'
          BUN_JSC_forceRAMSize: '4294967296'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 libx11-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          clang --version > "$ACCEPTANCE_EVIDENCE/regression-clang.log"
          scripts/build-app.sh test/native/worktree_lifecycle_test.bend "$ACCEPTANCE_EVIDENCE/worktree-lifecycle" > "$ACCEPTANCE_EVIDENCE/lifecycle-build.log" 2>&1
          "$ACCEPTANCE_EVIDENCE/worktree-lifecycle" > "$ACCEPTANCE_EVIDENCE/lifecycle-run.log" 2>&1
          cat "$ACCEPTANCE_EVIDENCE/lifecycle-run.log"
          test "$(grep -c '^ok ' "$ACCEPTANCE_EVIDENCE/lifecycle-run.log")" -eq 17
          ! grep -q -E '^(FAIL|Error:)' "$ACCEPTANCE_EVIDENCE/lifecycle-run.log"
      - name: Compile and run exact fused tile-plan regression
        if: matrix.scope == 'combined'
        env:
          BACKPLANE_SKIP_CHECK: '1'
          BACKPLANE_LOW_MEM: '1'
          BACKPLANE_JOBS: '2'
          BACKPLANE_GOOGLE_BAKE: '0'
          BUN_JSC_forceRAMSize: '4294967296'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y fontconfig libfreetype6 fonts-dejavu-core
          scripts/build-app.sh test/native/keep_plan_bench.bend "$ACCEPTANCE_EVIDENCE/keep-plan" > "$ACCEPTANCE_EVIDENCE/keep-plan-build.log" 2>&1
          "$ACCEPTANCE_EVIDENCE/keep-plan" > "$ACCEPTANCE_EVIDENCE/keep-plan-run.log" 2>&1
          test "$(grep -c '^ok ' "$ACCEPTANCE_EVIDENCE/keep-plan-run.log")" -eq 49
          ! grep -q -E '^(FAIL|Error:)' "$ACCEPTANCE_EVIDENCE/keep-plan-run.log"
          python3 - <<'PYCONTROL'
          import os
          from pathlib import Path
          rows = [line.split(',') for line in (Path(os.environ['ACCEPTANCE_EVIDENCE']) / 'keep-plan-run.log').read_text().splitlines() if line.startswith('sample,')]
          assert len(rows) == 100
          assert all(len(row) == 6 and row[4:] == ['6', '6'] for row in rows)
          print('49 exact rendering controls and 100 paired six-tile plans pass; timings are retained, not a whole-app claim')
          PYCONTROL
      - name: Native candidate build dependencies
        if: matrix.scope == 'native'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-19 libx11-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          clang --version | tee "$ACCEPTANCE_EVIDENCE/clang.log"
      - name: Native object cache
        if: matrix.scope == 'native'
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/obj
          key: contribution-linux-llvm19-${{ github.sha }}
          restore-keys: contribution-linux-llvm19-
      - name: Build the exact native candidate
        if: matrix.scope == 'native'
        timeout-minutes: 40
        env:
          BACKPLANE_SKIP_CHECK: '1'
          BACKPLANE_LOW_MEM: '1'
          BACKPLANE_JOBS: '2'
          BACKPLANE_GOOGLE_BAKE: '0'
        shell: bash
        run: |
          code=0
          scripts/build.sh > "$ACCEPTANCE_EVIDENCE/build.log" 2>&1 || code=$?
          printf '%s\n' "$code" > "$ACCEPTANCE_EVIDENCE/build.exit"
          cat "$ACCEPTANCE_EVIDENCE/build.log"
          exit "$code"
      - name: Record full acceptance receipt
        if: always()
        env:
          ACCEPTANCE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          export ACCEPTANCE_EVIDENCE="$RUNNER_TEMP/acceptance-evidence/$ACCEPTANCE_SCOPE"
          mkdir -p "$ACCEPTANCE_EVIDENCE"
          if [ -f "$RUNNER_TEMP/acceptance-inputs/support/accept.py" ]; then
            python3 "$RUNNER_TEMP/acceptance-inputs/support/accept.py" receipt \
              --scope "$ACCEPTANCE_SCOPE" --workspace "$GITHUB_WORKSPACE" --evidence "$ACCEPTANCE_EVIDENCE"
          else
            printf '{"result":"fail","error":"payload checkout or preservation failed","input_commit":"%s","checkout_commit":"30884966ef59c383581bcd1b7653f8f739cf009e","scope":"%s"}\n' \
              "$GITHUB_SHA" "$ACCEPTANCE_SCOPE" > "$ACCEPTANCE_EVIDENCE/receipt.json"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-acceptance-${{ matrix.scope }}-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-evidence/${{ matrix.scope }}
          if-no-files-found: error
          retention-days: 14
      - name: Identify available native outputs
        id: native_artifact
        if: always() && matrix.scope == 'native'
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/acceptance-evidence/native/artifacts/dist" ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload native build and source receipt
        uses: actions/upload-artifact@v4
        if: always() && matrix.scope == 'native' && steps.native_artifact.outputs.exists == 'true'
        with:
          name: frozen-native-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/acceptance-evidence/native/artifacts/dist
            ${{ runner.temp }}/acceptance-evidence/native/receipt.json
            ${{ runner.temp }}/acceptance-evidence/native/toolchain.log
            ${{ runner.temp }}/acceptance-evidence/native/clang.log
            ${{ runner.temp }}/acceptance-evidence/native/applied-source.json
            ${{ runner.temp }}/acceptance-evidence/native/source-after.json
            ${{ runner.temp }}/acceptance-evidence/native/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary swap
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/acceptance-swap" ]; then
            sudo swapoff "$RUNNER_TEMP/acceptance-swap" && sudo rm -f "$RUNNER_TEMP/acceptance-swap"
          fi
